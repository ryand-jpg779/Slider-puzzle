<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f3f0e8">
	<title>Slide &amp; Seek</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #20231f;
			--muted: #73766c;
			--paper: #f3f0e8;
			--tile: #fffdf7;
			--line: #dedbd1;
			--green: #2f704b;
			--lime: #d3ef74;
			--coral: #e77a5b;
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--paper);
			background-image: radial-gradient(#d7d4ca 0.65px, transparent 0.65px);
			background-size: 15px 15px;
		}

		.page {
			width: min(100% - 32px, 920px);
			min-height: 100vh;
			margin: 0 auto;
			display: grid;
			grid-template-columns: minmax(0, 1fr) minmax(250px, 0.72fr);
			align-items: center;
			gap: clamp(32px, 7vw, 88px);
			padding: 48px 0;
		}

		.eyebrow {
			margin: 0 0 14px;
			color: var(--green);
			font-size: 0.76rem;
			font-weight: 800;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 430px;
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(2.6rem, 6vw, 4.5rem);
			font-weight: 500;
			line-height: 0.98;
		}

		.intro {
			max-width: 350px;
			margin: 20px 0 30px;
			color: var(--muted);
			font-size: 1rem;
			line-height: 1.6;
		}

		.stats {
			display: flex;
			gap: 34px;
			margin-bottom: 30px;
		}

		.stat-label {
			display: block;
			margin-bottom: 5px;
			color: var(--muted);
			font-size: 0.72rem;
			font-weight: 800;
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}

		.stat-value {
			font-family: Georgia, "Times New Roman", serif;
			font-size: 1.8rem;
			font-variant-numeric: tabular-nums;
		}

		.new-game {
			min-height: 48px;
			padding: 0 19px;
			border: 0;
			border-radius: 4px;
			color: #fff;
			background: var(--green);
			font: inherit;
			font-size: 0.9rem;
			font-weight: 750;
			cursor: pointer;
			transition: background 140ms ease, transform 140ms ease;
		}

		.new-game:hover { background: #245c3c; transform: translateY(-1px); }
		.new-game:focus-visible, .tile:focus-visible, .board:focus-visible {
			outline: 3px solid var(--coral);
			outline-offset: 3px;
		}

		.game { width: min(100%, 430px); justify-self: center; }

		.board {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: clamp(7px, 1.5vw, 11px);
			width: 100%;
			aspect-ratio: 1;
			padding: clamp(9px, 2vw, 15px);
			border: 1px solid #d5d2c8;
			border-radius: 8px;
			background: #e7e4da;
			box-shadow: 0 16px 38px #34372d1a;
		}

		.tile, .empty {
			display: grid;
			place-items: center;
			min-width: 0;
			aspect-ratio: 1;
			border-radius: 5px;
		}

		.tile {
			border: 1px solid #e8e5da;
			color: var(--ink);
			background: var(--tile);
			box-shadow: 0 2px 0 #d9d5ca;
			font: 600 clamp(1.35rem, 5vw, 2.15rem)/1 Georgia, "Times New Roman", serif;
			cursor: pointer;
			transition: background 120ms ease, transform 120ms ease;
		}

		.tile:hover { background: #f8f6eb; transform: translateY(-2px); }
		.tile.last { color: #183624; background: var(--lime); }
		.empty { background: #d8d5ca; }

		.key-hint {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			margin: 18px 0 0;
			color: var(--muted);
			font-size: 0.84rem;
		}

		.keycaps { display: flex; gap: 4px; }

		kbd {
			display: grid;
			width: 27px;
			height: 27px;
			place-items: center;
			border: 1px solid var(--line);
			border-bottom-width: 2px;
			border-radius: 4px;
			color: var(--ink);
			background: #fffdf8;
			font: 700 0.9rem/1 sans-serif;
		}

		.message {
			min-height: 1.5em;
			margin: 10px 0 0;
			color: var(--green);
			font-size: 0.9rem;
			font-weight: 700;
			text-align: center;
		}

		@media (max-width: 680px) {
			.page {
				grid-template-columns: 1fr;
				align-content: center;
				gap: 30px;
				padding: 34px 0;
			}

			.intro { margin: 12px 0 20px; }
			.stats { margin-bottom: 20px; }
			.game { width: min(100%, 390px); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main class="page">
		<section aria-labelledby="title">
			<p class="eyebrow">A little daily brain stretch</p>
			<h1 id="title">Slide<br>&amp; Seek</h1>
			<p class="intro">Put every number back in order. Move the empty space with your arrow keys, or tap a tile beside it.</p>
			<div class="stats" aria-label="Game statistics">
				<div><span class="stat-label">Moves</span><span class="stat-value" id="moves">0</span></div>
				<div><span class="stat-label">Time</span><span class="stat-value" id="time">0:00</span></div>
			</div>
			<button class="new-game" id="new-game" type="button">New puzzle</button>
		</section>

		<section class="game" aria-label="Sliding puzzle">
			<div class="board" id="board" role="grid" aria-label="Number puzzle board" tabindex="0"></div>
			<p class="key-hint"><span>Move the empty space</span><span class="keycaps" aria-hidden="true"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span></p>
			<p class="message" id="message" aria-live="polite"></p>
		</section>
	</main>

	<script>
		const side = 4;
		const solved = Array.from({ length: side * side - 1 }, (_, index) => index + 1).concat(0);
		const boardElement = document.querySelector("#board");
		const movesElement = document.querySelector("#moves");
		const timeElement = document.querySelector("#time");
		const messageElement = document.querySelector("#message");
		let tiles = [...solved];
		let moves = 0;
		let startedAt = null;
		let timerId = null;
		let finished = false;

		function render() {
			boardElement.innerHTML = tiles.map((value, index) => {
				if (value === 0) return '<div class="empty" role="gridcell" aria-label="Empty space"></div>';
				const lastTile = value === side * side - 1 ? " last" : "";
				return `<button class="tile${lastTile}" type="button" role="gridcell" data-index="${index}" aria-label="Tile ${value}">${value}</button>`;
			}).join("");
			movesElement.textContent = moves;
		}

		function isSolved() {
			return tiles.every((value, index) => value === solved[index]);
		}

		function moveTo(index) {
			if (finished) return false;
			const emptyIndex = tiles.indexOf(0);
			const sameRow = Math.floor(index / side) === Math.floor(emptyIndex / side);
			const adjacent = (sameRow && Math.abs(index - emptyIndex) === 1) || Math.abs(index - emptyIndex) === side;
			if (!adjacent) return false;

			if (startedAt === null) {
				startedAt = Date.now();
				timerId = window.setInterval(updateTime, 250);
			}
			[tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
			moves += 1;
			render();

			if (isSolved()) {
				finished = true;
				window.clearInterval(timerId);
				messageElement.textContent = `Solved in ${moves} moves. Nicely done!`;
			}
			return true;
		}

		function updateTime() {
			const seconds = Math.floor((Date.now() - startedAt) / 1000);
			timeElement.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
		}

		function startNewGame() {
			tiles = [...solved];
			let previousEmpty = -1;
			for (let step = 0; step < 140; step += 1) {
				const emptyIndex = tiles.indexOf(0);
				const row = Math.floor(emptyIndex / side);
				const column = emptyIndex % side;
				const neighbors = [
					row > 0 ? emptyIndex - side : -1,
					row < side - 1 ? emptyIndex + side : -1,
					column > 0 ? emptyIndex - 1 : -1,
					column < side - 1 ? emptyIndex + 1 : -1
				].filter((index) => index !== -1 && index !== previousEmpty);
				const nextIndex = neighbors[Math.floor(Math.random() * neighbors.length)];
				[tiles[emptyIndex], tiles[nextIndex]] = [tiles[nextIndex], tiles[emptyIndex]];
				previousEmpty = emptyIndex;
			}
			moves = 0;
			startedAt = null;
			finished = false;
			window.clearInterval(timerId);
			timeElement.textContent = "0:00";
			messageElement.textContent = "";
			render();
			boardElement.focus();
		}

		boardElement.addEventListener("click", (event) => {
			const tile = event.target.closest("[data-index]");
			if (tile) moveTo(Number(tile.dataset.index));
		});

		document.addEventListener("keydown", (event) => {
			const directions = { ArrowUp: -side, ArrowDown: side, ArrowLeft: -1, ArrowRight: 1 };
			if (!(event.key in directions) || event.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
			event.preventDefault();
			const emptyIndex = tiles.indexOf(0);
			const targetIndex = emptyIndex + directions[event.key];
			if (targetIndex < 0 || targetIndex >= tiles.length) return;
			if ((event.key === "ArrowLeft" || event.key === "ArrowRight") && Math.floor(targetIndex / side) !== Math.floor(emptyIndex / side)) return;
			moveTo(targetIndex);
		});

		document.querySelector("#new-game").addEventListener("click", startNewGame);
		render();
		startNewGame();
	</script>
</body>
</html>
